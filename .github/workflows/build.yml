name: Build Zygisk Module

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential openjdk-17-jdk-headless unzip wget

    - name: Download Android NDK r25c
      run: |
        wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
        unzip -q android-ndk-r25c-linux.zip
        echo "ANDROID_NDK_HOME=$GITHUB_WORKSPACE/android-ndk-r25c" >> $GITHUB_ENV

    - name: Create Build Directory
      run: mkdir -p build

    - name: Run CMake with Android Toolchain for armeabi-v7a
      run: |
        cd build
        cmake .. \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=armeabi-v7a \
          -DANDROID_PLATFORM=android-23 \
          -DANDROID_STL=c++_static

    - name: Build Project
      run: cd build && make

    - name: Prepare Module Package
      run: |
        mkdir -p module_package/zygisk
        cp build/libzygisk.so module_package/zygisk/zygisk.so
        cp module.prop module_package/
        cp customize.sh module_package/
        chmod +x module_package/customize.sh

    - name: Create Module ZIP
      run: |
        cd module_package
        zip -r ../zygisk_module.zip .
        cd ..
        ls -lah zygisk_module.zip

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: zygisk-module
        path: zygisk_module.zip
