# .github/workflows/build.yml
name: Build Zygisk Module

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential openjdk-17-jdk-headless unzip wget

    - name: Download Android NDK r25c
      run: |
        wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
        unzip -q android-ndk-r25c-linux.zip
        echo "ANDROID_NDK_HOME=$GITHUB_WORKSPACE/android-ndk-r25c" >> $GITHUB_ENV

    - name: Create Build Directory
      run: mkdir -p build

    - name: Run CMake with Android Toolchain
      run: |
        cd build
        cmake .. \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-23

    - name: Build Project
      run: cd build && make

    - name: List Output Files
      run: ls -la build/

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: zygisk-module
        path: build/libzygisk.so
